    // ===== GOOGLE SHEETS AUTH INTEGRATION (V3) =====
    // GS_AUTH_URL_KEY / gsAuthUrl / gsSetAuthUrl are declared near the top of the script
    // so GitHub Pages bootstrap can safely call renderApp() before this section.
    async function gsApi(action, payload={}){
      const url=gsAuthUrl();
      if(!url) throw new Error('Google Apps Script Web App URL бапталмаған');
      try {
        // Simple form POST: avoids CORS preflight that often fails when DarynHub is opened as file://
        const body = new URLSearchParams();
        body.set('payload', JSON.stringify({action,...payload}));
        const response = await fetch(url, {
          method:'POST',
          body,
          redirect:'follow',
          cache:'no-store'
        });
        if(!response.ok) throw new Error('HTTP '+response.status);
        const text = await response.text();
        let data;
        try { data = JSON.parse(text); } catch (_) { throw new Error('Google API JSON қайтармады'); }
        if(!data.ok) throw new Error(data.error||'Сұраныс орындалмады');
        return data;
      } catch (err) {
        const msg = String(err && err.message ? err.message : err);
        if (/Failed to fetch|NetworkError|Load failed/i.test(msg)) {
          throw new Error('Google API-ға POST байланысы бұғатталды. Apps Script-ті New version ретінде қайта Deploy етіңіз және Web app access параметрін тексеріңіз.');
        }
        throw err;
      }
    }


    function mergeById_(localRows, remoteRows){
      const map=new Map((localRows||[]).map(x=>[String(x.id),x]));
      (remoteRows||[]).forEach(r=>{
        const id=String(r.id||''); if(!id)return;
        const old=map.get(id);
        if(old) Object.assign(old,r);
        else map.set(id,r);
      });
      return Array.from(map.values());
    }

    async function gsRefreshSharedData(showToast=false){
      if(!gsAuthUrl() || !state.currentUser) return;
      try{
        const data=await gsApi('getSharedData',{userId:state.currentUser.id,role:state.currentUser.role});
        state.students=mergeById_(state.students||[],data.students||[]);
        state.events=mergeById_(state.events||[],data.events||[]);
        state.applications=mergeById_(state.applications||[],data.applications||[]);
        state.projects=mergeById_(state.projects||[],data.projects||[]);
        state.projects.forEach(p=>{if(!Array.isArray(p.stages)||!p.stages.length)p.stages=V2_PROJECT_STAGES.map(name=>({name,done:false}));});
        saveState();
        if(showToast) v2Toast('Оқушылар мен өтінімдер Google Sheets-тен жаңартылды');
      }catch(e){
        console.warn('Shared data refresh failed:',e);
        if(showToast) v2Toast('Ортақ деректерді жаңарту қатесі: '+e.message,'error');
      }
    }

    function blobToBase64_(blob){
      return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]||'');r.onerror=()=>reject(r.error);r.readAsDataURL(blob);});
    }
    async function gsUploadDiplomaPdf(pdfBlob, diploma){
      if(!gsAuthUrl()) throw new Error('Google Apps Script Web App URL бапталмаған');
      const base64=await blobToBase64_(pdfBlob);
      return gsApi('uploadDiploma',{
        diplomaNumber:diploma.diplomaNumber, studentId:diploma.studentId, eventId:diploma.eventId,
        supervisorId:diploma.supervisorId||'', place:diploma.place||'', issueDate:diploma.issueDate||'',
        fileName:diploma.fileName||('Diploma_'+diploma.diplomaNumber+'.pdf'), base64:base64
      });
    }

    async function gsRefreshUsers(){

          if(!u){u={id:ru.id,googleUserId:ru.id,role:'TEACHER',avatar:(ru.name||'МҰ').split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase()};state.users.push(u);}
          Object.assign(u,{googleUserId:ru.id,name:ru.name,login:ru.login,email:ru.email||'',active:ru.active!==false,lastLogin:ru.lastLogin||'',createdAt:ru.createdAt||'',authDeleted:false});

    function rcDestroyCharts(){ reportCenterCharts.forEach(c=>{try{c.destroy()}catch(e){}}); reportCenterCharts=[]; }
    function rcDateInPeriod(dateStr, year, period){
      if(!dateStr) return true;
      const d=new Date(dateStr+'T00:00:00'); if(Number.isNaN(d.getTime())) return true;
      const startYear=parseInt(String(year).slice(0,4),10); if(Number.isNaN(startYear)) return true;
      const m=d.getMonth()+1, y=d.getFullYear();
      if(period==='q1') return y===startYear && m>=9 && m<=10;
      if(period==='q2') return (y===startYear && m>=11) || (y===startYear+1 && m===1);
      if(period==='h1') return (y===startYear && m>=9) || (y===startYear+1 && m===1);
      if(period==='q3') return y===startYear+1 && m>=2 && m<=3;
      if(period==='q4') return y===startYear+1 && m>=4 && m<=5;
      if(period==='h2') return y===startYear+1 && m>=2 && m<=5;
      return (y===startYear && m>=9) || (y===startYear+1 && m<=8);
    }
    function rcData(year,period){
      const by=(arr,dateKey='date')=>(arr||[]).filter(x=>(!x.academicYear||x.academicYear===year) && rcDateInPeriod(x[dateKey]||x.issueDate||x.createdAt,year,period));
      return {students:(state.students||[]).filter(s=>!s.archived),evs:by((state.events||[]).filter(e=>!e.archived)),apps:by(state.applications),projs:by(state.projects,'startDate'),ach:by(state.achievements),dips:by(state.diplomas,'issueDate')};
    }
    function rcCount(list,fn){const o={};(list||[]).forEach(x=>{const k=fn(x)||'Белгісіз';o[k]=(o[k]||0)+1});return o;}
    function rcFilteredData(d,type){
      if(type==='olympiad'){const ids=new Set(d.evs.filter(e=>e.type==='Олимпиада').map(e=>e.id));return {...d,evs:d.evs.filter(e=>ids.has(e.id)),apps:d.apps.filter(a=>ids.has(a.eventId)),ach:d.ach.filter(a=>a.type==='Олимпиада'||ids.has(a.eventId)),dips:d.dips.filter(x=>ids.has(x.eventId))};}
      if(type==='projects') return {...d,evs:d.evs.filter(e=>e.type==='Ғылыми жоба'),apps:d.apps.filter(a=>d.evs.some(e=>e.id===a.eventId&&e.type==='Ғылыми жоба')),ach:d.ach.filter(a=>a.type==='Ғылыми жоба'),dips:d.dips.filter(x=>d.evs.some(e=>e.id===x.eventId&&e.type==='Ғылыми жоба'))};
      if(type==='achievements') return {...d,evs:[],apps:[],projs:[],dips:[]};
      if(type==='events') return {...d,apps:[],projs:[],ach:[],dips:[]};
      if(type==='diplomas') return {...d,evs:[],apps:[],projs:[],ach:[]};
      return d;
    }

      const levels=rcCount(d.ach,a=>a.level); const subjects=rcCount(d.ach,a=>a.subject||state.events.find(e=>e.id===a.eventId)?.subject);
      const bestSubject=Object.entries(subjects).sort((a,b)=>b[1]-a[1])[0];
      const high=(levels['Республикалық']||0)+(levels['Халықаралық']||0);

    }

      const months=['Қыр','Қаз','Қар','Жел','Қаң','Ақп','Нау','Сәу','Мам','Мау','Шіл','Там']; const start=parseInt(String(year).slice(0,4),10); const monthly=months.map((_,i)=>{const mm=i<4?i+9:i-3,yy=i<4?start:start+1;return d.evs.filter(e=>{const x=new Date((e.date||'')+'T00:00:00');return x.getFullYear()===yy&&x.getMonth()+1===mm}).length});
      const mk=(id,cfg)=>{const el=document.getElementById(id);if(el)reportCenterCharts.push(new Chart(el,cfg));}; const barOpt={responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{precision:0}},x:{grid:{display:false}}}};
      mk('rc-subject',{type:'bar',data:{labels:Object.keys(subjects),datasets:[{data:Object.values(subjects),backgroundColor:'#3b82f6',borderRadius:8}]},options:barOpt});
      mk('rc-place',{type:'doughnut',data:{labels:Object.keys(places),datasets:[{data:Object.values(places),backgroundColor:['#10b981','#3b82f6','#f59e0b','#8b5cf6','#f43f5e','#94a3b8'],borderWidth:3,borderColor:'#fff'}]},options:{responsive:true,maintainAspectRatio:false,cutout:'62%',plugins:{legend:{position:'bottom'}}}});
      mk('rc-level',{type:'bar',data:{labels:Object.keys(levels),datasets:[{data:Object.values(levels),backgroundColor:'#8b5cf6',borderRadius:8}]},options:{...barOpt,indexAxis:'y'}});
      mk('rc-month',{type:'line',data:{labels:months,datasets:[{label:'Іс-шара',data:monthly,borderColor:'#0ea5e9',backgroundColor:'rgba(14,165,233,.12)',fill:true,tension:.35}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{precision:0}}}}});
    }
    function v2PrintReport(){
      const year=document.getElementById('v2-report-year')?.value||state.currentAcademicYear,d=rcFilteredData(rcData(year,reportCenterPeriod),reportCenterType),places=rcCount(d.ach,a=>a.place),levels=rcCount(d.ach,a=>a.level),subjects=rcCount(d.ach,a=>a.subject||state.events.find(e=>e.id===a.eventId)?.subject); const w=window.open('','_blank');
      w.document.write(`<html><head><meta charset="utf-8"><title>DarynHub есеп ${year}</title><style>body{font-family:Arial,sans-serif;padding:32px;color:#172033}h1{margin-bottom:4px}.muted{color:#64748b}.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.box{border:1px solid #ddd;border-radius:10px;padding:12px}.n{font-size:26px;font-weight:bold}table{border-collapse:collapse;width:100%;margin-top:12px}td,th{border:1px solid #ddd;padding:8px;text-align:left;font-size:12px}h2{margin-top:24px;font-size:18px}</style></head><body><h1>DarynHub — басқарушылық есеп</h1><div class="muted">${year} • ${reportCenterPeriod}</div><div class="kpi"><div class="box">Дарынды оқушылар<div class="n">${d.students.length}</div></div><div class="box">Іс-шаралар<div class="n">${d.evs.length}</div></div><div class="box">Өтінімдер<div class="n">${d.apps.length}</div></div><div class="box">Ғылыми жобалар<div class="n">${d.projs.length}</div></div><div class="box">Жүлделер<div class="n">${d.ach.length}</div></div><div class="box">Дипломдар<div class="n">${d.dips.length}</div></div></div><h2>Қысқаша қорытынды</h2><p>${escapeHtml(rcSummary(d,year))}</p><h2>Жүлделі орындар</h2><table><tr><th>Орын</th><th>Саны</th></tr>${Object.entries(places).map(x=>`<tr><td>${escapeHtml(x[0])}</td><td>${x[1]}</td></tr>`).join('')}</table><h2>Деңгейлер</h2><table><tr><th>Деңгей</th><th>Саны</th></tr>${Object.entries(levels).map(x=>`<tr><td>${escapeHtml(x[0])}</td><td>${x[1]}</td></tr>`).join('')}</table><h2>Пәндер</h2><table><tr><th>Пән</th><th>Нәтиже</th></tr>${Object.entries(subjects).map(x=>`<tr><td>${escapeHtml(x[0])}</td><td>${x[1]}</td></tr>`).join('')}</table><h2>Жетістіктер</h2><table><tr><th>Оқушы</th><th>Пән</th><th>Деңгей</th><th>Орын</th></tr>${d.ach.map(a=>`<tr><td>${escapeHtml(state.students.find(s=>s.id===a.studentId)?.name||'')}</td><td>${escapeHtml(a.subject||'')}</td><td>${escapeHtml(a.level||'')}</td><td>${escapeHtml(a.place||'')}</td></tr>`).join('')}</table><script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close();
    }
    function v2ExportReportXlsx(){
      if(!window.XLSX)return v2Toast('SheetJS жүктелмеді','error'); const year=document.getElementById('v2-report-year')?.value||state.currentAcademicYear,d=rcFilteredData(rcData(year,reportCenterPeriod),reportCenterType),wb=XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet([{Көрсеткіш:'Дарынды оқушылар',Саны:d.students.length},{Көрсеткіш:'Іс-шаралар',Саны:d.evs.length},{Көрсеткіш:'Өтінімдер',Саны:d.apps.length},{Көрсеткіш:'Ғылыми жобалар',Саны:d.projs.length},{Көрсеткіш:'Жүлделер',Саны:d.ach.length},{Көрсеткіш:'Дипломдар',Саны:d.dips.length}]),'Жалпы');
      XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(d.ach.map(a=>({Оқушы:state.students.find(s=>s.id===a.studentId)?.name||'',Пән:a.subject||'',Деңгей:a.level||'',Орын:a.place||'',Күні:a.date||''}))),'Жетістіктер');
      XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(d.projs.map(p=>({Оқушы:state.students.find(s=>s.id===p.studentId)?.name||'',Жоба:p.title||'',Пән:p.subject||'',Прогресс:p.progress||0,Статус:p.status||''}))),'Ғылыми жобалар');
      XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(d.apps.map(a=>({Оқушы:state.students.find(s=>s.id===a.studentId)?.name||'',Ісшара:state.events.find(e=>e.id===a.eventId)?.title||'',Статус:STATUS_LABELS[a.status]||a.status,Күні:a.date||''}))),'Өтінімдер');
      XLSX.writeFile(wb,`DarynHub_Есеп_${year}.xlsx`);
    }
    const rcOldRenderApp=renderApp;
    renderApp=function(){rcOldRenderApp();if(state.currentUser&&currentView==='reports')setTimeout(rcInitCharts,100);};



    // ===== TELEGRAM BOT INTEGRATION (V4) =====
    let telegramSyncTimer = null;
    async function telegramCloudSyncNow(showToast=false){
      if(!gsAuthUrl()) { if(showToast) v2Toast('Google Apps Script URL бапталмаған','error'); return; }
      try {
        await gsApi('syncBotData',{
          students:(state.students||[]).filter(x=>!x.archived).map(x=>({id:x.id,name:x.name,grade:x.grade,supervisorId:x.supervisorId||''})),
          events:(state.events||[]).filter(x=>!x.archived).map(x=>({id:x.id,title:x.title,type:x.type,level:x.level,date:x.date,deadline:x.deadline,subject:x.subject})),
          applications:(state.applications||[]).map(x=>({id:x.id,studentId:x.studentId,teacherId:x.teacherId,eventId:x.eventId,status:x.status,date:x.date})),
          diplomas:(state.diplomas||[]).map(x=>({id:x.id,studentId:x.studentId,supervisorId:x.supervisorId||state.students.find(s=>s.id===x.studentId)?.supervisorId||'',eventId:x.eventId,place:x.place,diplomaNumber:x.diplomaNumber,driveUrl:x.driveUrl||'',issueDate:x.issueDate})),
          projects:(state.projects||[]).map(x=>({id:x.id,studentId:x.studentId,supervisorId:x.supervisorId||state.students.find(s=>s.id===x.studentId)?.supervisorId||'',title:x.title,progress:x.progress||0,deadline:x.deadline||'',subject:x.subject||'',status:x.status||'IN_PROGRESS',category:x.category||'',researchQuestion:x.researchQuestion||'',hypothesis:x.hypothesis||'',description:x.description||'',startDate:x.startDate||'',academicYear:x.academicYear||state.currentAcademicYear,stages:x.stages||[]}))
        });
        if(showToast) v2Toast('Telegram бот деректері синхрондалды');
      } catch(e) { if(showToast) alert('Telegram синхрондау қатесі: '+e.message); else console.warn('Telegram sync:',e.message); }
    }
    function scheduleTelegramCloudSync(){ clearTimeout(telegramSyncTimer); telegramSyncTimer=setTimeout(()=>telegramCloudSyncNow(false),1200); }
    const telegramOriginalSaveState = saveState;
    saveState = function(){ telegramOriginalSaveState(); if(state.currentUser && gsAuthUrl()) scheduleTelegramCloudSync(); };

    async function telegramGetLinkCode(){
      if(!state.currentUser || state.currentUser.role!=='TEACHER') return;
      try { const d=await gsApi('telegramLinkCode',{userId:state.currentUser.id}); document.getElementById('tg-link-result').innerHTML=`<div class="p-4 bg-blue-50 border border-blue-200 rounded-xl"><div class="text-xs text-slate-500">Telegram ботқа жіберетін команда</div><div class="text-2xl font-bold font-mono mt-1">/link ${escapeHtml(d.code)}</div><div class="text-[11px] text-slate-500 mt-2">Код 15 минут жарамды. Telegram-да DarynHub ботын ашып, осы команданы жіберіңіз.</div></div>`; } catch(e){alert(e.message);}
    }
    async function telegramRefreshStatus(){
      if(!state.currentUser || state.currentUser.role!=='TEACHER') return;
      const el=document.getElementById('tg-status'); if(!el)return; el.textContent='Тексерілуде...';
      try{const d=await gsApi('telegramStatus',{userId:state.currentUser.id});el.innerHTML=d.connected?`<span class="text-emerald-600 font-semibold">● Байланысқан ${d.username?'@'+escapeHtml(d.username):''}</span>`:`<span class="text-amber-600 font-semibold">● Байланыспаған</span>`;}catch(e){el.textContent=e.message;}
    }
    function v4RenderTelegram(){
      const teacher=state.currentUser.role==='TEACHER';
      return `<div class="space-y-6 animate-fadeIn"><div><h2 class="text-2xl font-bold">Telegram Assistant</h2><p class="text-sm text-slate-500">DarynHub хабарламалары мен күнделікті ақпаратты Telegram-нан алыңыз</p></div>
      <div class="grid lg:grid-cols-2 gap-5"><div class="bg-white border rounded-2xl p-5"><div class="flex items-center justify-between"><div><h3 class="font-bold">Telegram байланысы</h3><div id="tg-status" class="text-xs mt-1 text-slate-500">${teacher?'Тексеру үшін батырманы басыңыз':'Admin үшін деректер синхрондауы қолжетімді'}</div></div><div class="w-12 h-12 rounded-2xl bg-sky-100 text-sky-600 flex items-center justify-center"><i class="fa-brands fa-telegram text-2xl"></i></div></div>
      ${teacher?`<div class="grid grid-cols-2 gap-2 mt-4"><button onclick="telegramGetLinkCode()" class="py-2.5 bg-sky-500 text-white rounded-xl text-xs font-semibold">Байланыстыру кодын алу</button><button onclick="telegramRefreshStatus()" class="py-2.5 border rounded-xl text-xs font-semibold">Статусты тексеру</button></div><div id="tg-link-result" class="mt-4"></div>`:`<button onclick="telegramCloudSyncNow(true)" class="mt-4 w-full py-2.5 bg-blue-600 text-white rounded-xl text-xs font-semibold"><i class="fa-solid fa-cloud-arrow-up mr-2"></i>Бот деректерін қазір синхрондау</button>`}</div>
      <div class="bg-white border rounded-2xl p-5"><h3 class="font-bold mb-3">Бот мүмкіндіктері</h3><div class="grid grid-cols-2 gap-2 text-xs">${['🏆 Менің оқушыларым','📅 Алдағы жарыстар','📄 Менің өтінімдерім','⏰ Дедлайндар','🏅 Дипломдар','🔬 Ғылыми жобалар'].map(x=>`<div class="p-3 bg-slate-50 rounded-xl">${x}</div>`).join('')}</div><p class="text-[11px] text-slate-500 mt-4">Өтінім статусы өзгергенде, жаңа іс-шара немесе диплом пайда болғанда бот автоматты хабарлама жібереді. Дедлайндар күн сайын тексеріледі.</p></div></div>
      <div class="bg-sky-50 border border-sky-200 rounded-2xl p-5 text-sm"><b>Бір рет баптау:</b> Apps Script Script Properties ішінде <code>TELEGRAM_BOT_TOKEN</code> сақтап, <code>setupTelegramBot()</code> функциясын бір рет Run жасаңыз. Содан кейін Web App-ты New version ретінде Deploy етіңіз.</div></div>`;
    }

    const v4OldNavItems = v2NavItems;
    v2NavItems = function(){ const items=v4OldNavItems(); const idx=items.findIndex(x=>x.id==='settings'); items.splice(idx<0?items.length:idx,0,{id:'telegram',label:'Telegram бот',icon:'fa-paper-plane'}); return items; };
    const v4OldRenderMainView = renderMainView;
    renderMainView = function(){ if(currentView==='telegram') return v4RenderTelegram(); return v4OldRenderMainView(); };
    // Sync once after a successful session opens.
    if(state.currentUser && gsAuthUrl()) setTimeout(()=>telegramCloudSyncNow(false),1800);
    // Initial render earlier in the file can happen before V3/V4 nav overrides are installed.
    // Re-render once now so Admin immediately sees Қолданушылар / Telegram / Баптаулар.
    if(state.currentUser) setTimeout(()=>renderApp(),0);
  </script>
</body>
</html>
