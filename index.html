    const idbHelper = {
      dbName: 'DarynHubDB',
      storeName: 'diplomaFiles',
      init() {
        return new Promise((resolve, reject) => {
          const req = indexedDB.open(this.dbName, 1);
          req.onupgradeneeded = (e) => {
            if (!e.target.result.objectStoreNames.contains(this.storeName)) {
              e.target.result.createObjectStore(this.storeName);
            }
          };
          req.onsuccess = (e) => resolve(e.target.result);
          req.onerror = (e) => reject(e.target.error);
        });
      },
      async saveFile(id, fileBlob) {
        const db = await this.init();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(this.storeName, 'readwrite');
          const store = tx.objectStore(this.storeName);
          const req = store.put(fileBlob, id);
          req.onsuccess = () => resolve();
          req.onerror = () => reject(req.error);
        });
      },
      async getFile(id) {
        const db = await this.init();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(this.storeName, 'readonly');
          const store = tx.objectStore(this.storeName);
          const req = store.get(id);
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      },
      async deleteFile(id) {
        const db = await this.init();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(this.storeName, 'readwrite');
          const store = tx.objectStore(this.storeName);
          const req = store.delete(id);
          req.onsuccess = () => resolve();
          req.onerror = () => reject(req.error);
        });
      }

    function generateNextDiplomaNumber() {
      const year = new Date().getFullYear();
      const existingNums = (state.diplomas || [])
        .map(d => d.diplomaNumber)
        .filter(n => n && n.startsWith(`DH-${year}-`))
        .map(n => parseInt(n.split('-')[2], 10))
        .filter(n => !isNaN(n));
      
      const maxNum = existingNums.length > 0 ? Math.max(...existingNums) : 0;
      const nextNum = (maxNum + 1).toString().padStart(4, '0');
      return `DH-${year}-${nextNum}`;
    }

    // МӘТІНДІ АВТОМАТТЫ СЫЙДЫРУЖӘНЕ CANVAS-ҚА ЖАЗУ
    function renderCanvasTextWithAutofit(ctx, text, x, y, options, canvasWidth) {
      if (!text) return;
      let { fontSize, fontWeight, textAlign, fontColor, fontFamily, maxWidthRatio } = options;
      const maxWidth = canvasWidth * (maxWidthRatio || 0.8);
      const minFontSize = 12;
      let currentFontSize = fontSize || 24;

      ctx.font = `${fontWeight || 'normal'} ${currentFontSize}px ${fontFamily || 'Inter, sans-serif'}`;
      let textWidth = ctx.measureText(text).width;

      // Мәтін белгіленген енге сыймаса, fontSize кішірейтіледі
      while (textWidth > maxWidth && currentFontSize > minFontSize) {
        currentFontSize -= 1;
        ctx.font = `${fontWeight || 'normal'} ${currentFontSize}px ${fontFamily || 'Inter, sans-serif'}`;
        textWidth = ctx.measureText(text).width;
      }

      ctx.fillStyle = fontColor || '#1e293b';
      ctx.textAlign = textAlign || 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, x, y);
    }

    // ДИПЛОМ ДАЙЫНДАУ CANVAS СУРЕТІН ҚҰРУ (ЖОҒАРЫ САПАДА)
    async function drawCertificateCanvas(template, student, event, place, issueDate, diplomaNumber) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');

      let bgImg = null;
      try {
        const fileBlob = await idbHelper.getFile(template.id);
        if (fileBlob) {
          bgImg = await new Promise((resolve) => {
            const img = new Image();
            img.onload = () => resolve(img);
            img.src = URL.createObjectURL(fileBlob);
          });
        }
      } catch (e) {
        console.warn("Could not load image blob from IndexedDB", e);
      }

      if (bgImg) {
        canvas.width = bgImg.naturalWidth || template.width || 1200;
        canvas.height = bgImg.naturalHeight || template.height || 850;
        ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
      } else {
        // Фонолық әдепкі сурет жоқ болса, векторлық стильді шаблон сызамыз
        canvas.width = template.width || 1200;
        canvas.height = template.height || 850;
        
        // Фон
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Сәнді алтын/көк жиек
        ctx.strokeStyle = '#1e3a8a';
        ctx.lineWidth = 12;
        ctx.strokeRect(30, 30, canvas.width - 60, canvas.height - 60);

        ctx.strokeStyle = '#b45309';
        ctx.lineWidth = 4;
        ctx.strokeRect(45, 45, canvas.width - 90, canvas.height - 90);

        // Тақырып
        ctx.fillStyle = '#1e3a8a';
        ctx.font = 'bold 52px Inter, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('ДИПЛОМ', canvas.width / 2, 160);

        ctx.fillStyle = '#64748b';
        ctx.font = 'italic 18px Inter, sans-serif';
        ctx.fillText('ОСЫ ДИПЛОМ МАРПАТТАЛАДЫ:', canvas.width / 2, 230);
      }

      // Мәндер картасы
      const supervisor = state.users.find(u => u.id === (student?.supervisorId));
      const values = {
        studentName: student?.name || '',
        class: student?.grade ? `${student.grade} сынып` : '',
        eventName: event?.title || '',
        place: place || '',
        subject: event?.subject || student?.direction || '',
        supervisor: supervisor ? supervisor.name : (student?.supervisorName || ''),
        date: issueDate || new Date().toISOString().split('T')[0],
        diplomaNumber: diplomaNumber || generateNextDiplomaNumber()
      };

      // Масштаб коэффициенті (1000px эталонына қарағанда)
      const scale = canvas.width / 1000;

      if (template.fields) {
        Object.keys(template.fields).forEach(key => {
          const field = template.fields[key];
          if (field && field.active && values[key]) {
            const x = field.x * canvas.width;
            const y = field.y * canvas.height;
            const scaledFontSize = Math.round(field.fontSize * scale);

            renderCanvasTextWithAutofit(ctx, values[key], x, y, {
              fontSize: scaledFontSize,
              fontWeight: field.fontWeight,
              textAlign: field.textAlign,
              fontColor: field.fontColor,
              fontFamily: field.fontFamily,
              maxWidthRatio: field.maxWidth
            }, canvas.width);
          }
        });
      }

      return canvas;
    }

    // CANVAS-ТЫ PDF BLOB-ҚА АЙНАЛДЫРУ (jsPDF CDN арқылы)
    async function canvasToPdfBlob(canvas) {
      // HIGH QUALITY: PNG is lossless, so small Kazakh letters, QR and thin template lines stay sharp.
      // The PDF page uses the canvas' original pixel dimensions; uploaded high-resolution templates
      // therefore keep their native print quality instead of being downscaled to the preview size.
      const imgData = canvas.toDataURL('image/png');
      const { jsPDF } = window.jspdf;
      const orientation = canvas.width >= canvas.height ? 'landscape' : 'portrait';
      const pdf = new jsPDF({ orientation, unit: 'px', format: [canvas.width, canvas.height], compress: true, hotfixes: ['px_scaling'] });
      pdf.addImage(imgData, 'PNG', 0, 0, canvas.width, canvas.height, undefined, 'FAST');
      pdf.setProperties({ title: 'DarynHub дипломы', subject: 'Жоғары сапалы автоматты диплом', creator: 'DarynHub' });
      return pdf.output('blob');
    }

      }

      const rows = [
        ['№', 'Оқушының аты-жөні', 'Сыныбы', 'Іс-шара атауы', 'Пәні/Бағыты', 'Жетекші мұғалім', 'Күні', 'Статусы', 'Ескертпе']
      ];

      filtered.forEach((app, index) => {
        const student = state.students.find(s => s.id === app.studentId) || {};
        const event = state.events.find(e => e.id === app.eventId) || {};
        const teacher = state.users.find(u => u.id === app.teacherId) || {};

        const csvEscape = (value) => `"${String(value ?? '').replace(/"/g, '""')}"`;
        rows.push([
          index + 1,
          csvEscape(student.name || ''),
          csvEscape(`${student.grade || ''} сынып`),
          csvEscape(event.title || ''),
          csvEscape(app.subject || ''),
          csvEscape(teacher.name || ''),
          csvEscape(app.date || ''),
          csvEscape(STATUS_LABELS[app.status] || app.status),
          csvEscape(app.comment || '')
        ]);
      });

      const csvContent = "\uFEFF" + rows.map(e => e.join(",")).join("\n");
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement("a");
      const url = URL.createObjectURL(blob);
      link.setAttribute("href", url);
      link.setAttribute("download", `DarynHub_Өтінімдер_${new Date().toISOString().split('T')[0]}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    async function refreshSettingsSync_(){const el=document.getElementById('settings-sync-result');if(el)el.textContent='Синхрондалуда...';try{await gsRefreshSharedData(false);if(el)el.innerHTML='<span class="text-emerald-600">Соңғы синхрондау: '+new Date().toLocaleString('kk-KZ')+'</span>';saveState();}catch(e){if(el)el.innerHTML='<span class="text-rose-600">Синхрондау қатесі</span>';}}

        function initDashboardCharts() {
      setTimeout(() => {
        const ctx = document.getElementById('dashboardChart');
        if (!ctx) return;
        
        const counts = { APPROVED: 0, REJECTED: 0, UNDER_REVIEW: 0, SUBMITTED: 0 };
        state.applications.forEach(app => {
          if (counts[app.status] !== undefined) counts[app.status]++;
        });

        new Chart(ctx, {
          type: 'doughnut',
          data: {
            labels: ['Қабылданды', 'Қабылданбады', 'Қаралуда', 'Жіберілді'],
            datasets: [{
              data: [counts.APPROVED, counts.REJECTED, counts.UNDER_REVIEW, counts.SUBMITTED],
              backgroundColor: ['#10b981', '#f43f5e', '#f59e0b', '#3b82f6'],
              borderWidth: 0,
              hoverOffset: 4
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11, family: 'Inter' } } }
            },
            cutout: '70%'
          }
        });

        const barCtx = document.getElementById('barChart');
        if (barCtx) {
          const monthIndexes = [8, 9, 10, 11, 0, 1]; // Қыркүйек–Ақпан
          const monthLabels = ['Қыркүйек', 'Қазан', 'Қараша', 'Желтоқсан', 'Қаңтар', 'Ақпан'];
          const countEventsByType = (type) => monthIndexes.map(monthIndex =>
            state.events.filter(event => {
              if (event.type !== type || !event.date) return false;
              const date = new Date(`${event.date}T00:00:00`);
              return !Number.isNaN(date.getTime()) && date.getMonth() === monthIndex;
            }).length
          );

          new Chart(barCtx, {
            type: 'bar',
            data: {
              labels: monthLabels,
              datasets: [
                { label: 'Олимпиадалар', data: countEventsByType('Олимпиада'), backgroundColor: '#3b82f6', borderRadius: 6 },
                { label: 'Ғылыми жобалар', data: countEventsByType('Ғылыми жоба'), backgroundColor: '#8b5cf6', borderRadius: 6 },
                { label: 'Байқаулар', data: countEventsByType('Байқау'), backgroundColor: '#10b981', borderRadius: 6 }
              ]
            },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } }, scales: { y: { beginAtZero: true, ticks: { precision: 0 }, grid: { color: '#f1f5f9' } }, x: { grid: { display: false } } } }
          });
        }

        const pieCtx = document.getElementById('pieChart');
        if (pieCtx) {
          const iPlaces = state.achievements.filter(a => a.place === 'I орын').length;
          const iiPlaces = state.achievements.filter(a => a.place === 'II орын').length;
          const iiiPlaces = state.achievements.filter(a => a.place === 'III орын').length;
          const certificates = (state.diplomas || []).filter(d => d.place === 'Сертификат' || d.place === 'Грамота').length;
          new Chart(pieCtx, {
            type: 'doughnut',
            data: { labels: ['I орын', 'II орын', 'III орын', 'Сертификат/Грамота'], datasets: [{ data: [iPlaces, iiPlaces, iiiPlaces, certificates], backgroundColor: ['#10b981', '#3b82f6', '#f59e0b', '#94a3b8'] }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } }, cutout: '65%' }
          });
        }
      }, 100);
    }

    function handleApplySubmit(e, eventId) {
      e.preventDefault();
      const studentId = document.getElementById('app-student').value;
      const subject = document.getElementById('app-subject').value;
      const comment = document.getElementById('app-comment').value;

      const duplicateApplication = state.applications.some(a =>
        a.studentId === studentId &&
        a.eventId === eventId &&
        a.status !== 'REJECTED'
      );
      if (duplicateApplication) {
        alert('Бұл оқушы осы іс-шараға бұрыннан тіркелген. Қайталама өтінім жіберуге болмайды.');
        return;
      }

      const newApp = {
        id: `app${Date.now()}`,
        eventId: eventId,
        studentId: studentId,
        teacherId: state.currentUser.id,
        status: 'SUBMITTED',
        date: new Date().toISOString().split('T')[0],
        subject: subject,
        comment: comment
      };

      state.applications.unshift(newApp);
      const student = state.students.find(s => s.id === studentId);
      addNotification(`Жаңа өтінім тіркелді: ${student ? student.name : 'Оқушы'}`);
      saveState();
      closeModal();
      renderApp();
    }

          const e = state.events.find(ev => ev.id === a.eventId);

                              </button>
                              <button onclick="openRejectModal('${app.id}')" class="p-1.5 bg-rose-50 text-rose-600 hover:bg-rose-100 rounded-lg transition-colors" title="Қабылдамау">
                                <i class="fa-solid fa-xmark"></i>
                              </button>
                              <button onclick="openApplicationDetails('${app.id}')" class="p-1.5 bg-slate-50 text-slate-500 hover:bg-slate-100 hover:text-slate-700 rounded-lg transition-colors" title="Толық көру">

                              </button>

                            <button onclick="openApplicationDetails('${app.id}')" class="text-slate-400 hover:text-slate-600 p-1.5" title="Толық көру">
                              <i class="fa-solid fa-eye"></i>
                            </button>

                        </td>
                      </tr>
                    `;
                  }).join('')}
                  ${filteredApps.length === 0 ? `<tr><td colspan="5" class="p-8 text-center text-slate-500">Өтінімдер табылмады</td></tr>` : ''}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    function renderDiplomas() {
      const isAdmin = state.currentUser.role === 'ADMIN';

      return `
        <div class="space-y-6 animate-fadeIn">
          <div class="flex flex-col sm:flex-row sm:justify-between sm:items-end gap-4">
            <div>
              <h2 class="text-2xl font-bold text-slate-800">Дипломдар</h2>
              <p class="text-sm text-slate-500 mt-1">Оқушылардың марапаттары, шаблондары және авто-генерация</p>
            </div>
            
            <div class="flex flex-wrap gap-2">
              ${isAdmin ? `
                <button onclick="openAddDiplomaModal()" class="px-3.5 py-2 bg-white border border-slate-300 text-slate-700 rounded-xl text-xs font-semibold hover:bg-slate-50 transition-colors shadow-sm flex items-center">

                </button>

          </div>

          <!-- Навигациялық Tab-тар -->
          <div class="border-b border-slate-200 flex space-x-6">
            <button onclick="activeDiplomaTab='list'; renderApp();" class="pb-3 text-sm font-semibold transition-colors border-b-2 ${activeDiplomaTab === 'list' ? 'border-blue-600 text-blue-600' : 'border-transparent text-slate-500 hover:text-slate-800'}">
              <i class="fa-solid fa-list-check mr-2"></i> Жүктелген/Дайын дипломдар
            </button>

            ${isAdmin ? `
              <button onclick="activeDiplomaTab='templates'; renderApp();" class="pb-3 text-sm font-semibold transition-colors border-b-2 ${activeDiplomaTab === 'templates' ? 'border-blue-600 text-blue-600' : 'border-transparent text-slate-500 hover:text-slate-800'}">
                <i class="fa-solid fa-file-image mr-2"></i> Диплом шаблондары
              </button>
              <button onclick="activeDiplomaTab='generate'; renderApp();" class="pb-3 text-sm font-semibold transition-colors border-b-2 ${activeDiplomaTab === 'generate' ? 'border-blue-600 text-blue-600' : 'border-transparent text-slate-500 hover:text-slate-800'}">
                <i class="fa-solid fa-wand-magic-sparkles mr-2"></i> Диплом жасау (Жеке)
              </button>
              <button onclick="activeDiplomaTab='bulk'; renderApp();" class="pb-3 text-sm font-semibold transition-colors border-b-2 ${activeDiplomaTab === 'bulk' ? 'border-blue-600 text-blue-600' : 'border-transparent text-slate-500 hover:text-slate-800'}">

    function renderDiplomaTabContent() {
      if (activeDiplomaTab === 'templates' && state.currentUser.role === 'ADMIN') {
        return renderDiplomaTemplatesTab();
      } else if (activeDiplomaTab === 'generate' && state.currentUser.role === 'ADMIN') {
        return renderDiplomaGenerateTab();
      } else if (activeDiplomaTab === 'bulk' && state.currentUser.role === 'ADMIN') {
        return renderDiplomaBulkTab();
      } else {
        return renderDiplomaListTab();
      }
    }

    function renderDiplomaListTab() {
      let filteredDiplomas = state.diplomas || [];

      // Мұғалім тек өзінің оқушыларының дипломын көреді
      if (state.currentUser.role === 'TEACHER') {
        const myStudentIds = state.students.filter(s => s.supervisorId === state.currentUser.id).map(s => s.id);
        filteredDiplomas = filteredDiplomas.filter(d => myStudentIds.includes(d.studentId) || d.supervisorId === state.currentUser.id);
      }

      if (activeDiplomaFilters.event) {
        filteredDiplomas = filteredDiplomas.filter(d => d.eventId === activeDiplomaFilters.event);
      }
      if (activeDiplomaFilters.student) {
        filteredDiplomas = filteredDiplomas.filter(d => d.studentId === activeDiplomaFilters.student);
      }
      if (activeDiplomaFilters.place) {
        filteredDiplomas = filteredDiplomas.filter(d => d.place === activeDiplomaFilters.place);
      }
      if (searchQuery) {
        const lowerQ = searchQuery.toLowerCase();
        filteredDiplomas = filteredDiplomas.filter(d => {
          const s = state.students.find(st => st.id === d.studentId);
          const e = state.events.find(ev => ev.id === d.eventId);
          return (s && s.name.toLowerCase().includes(lowerQ)) || (e && e.title.toLowerCase().includes(lowerQ));
        });
      }

      return `
        <div class="space-y-4">
          <!-- Фильтрлер -->
          <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-wrap gap-4">
            <div class="flex-1 min-w-[200px]">
              <label class="block text-[10px] font-semibold text-slate-500 uppercase mb-1">Іс-шара бойынша</label>
              <select onchange="activeDiplomaFilters.event = this.value; renderApp();" class="w-full text-sm p-2 border border-slate-200 rounded-lg bg-slate-50 focus:outline-none focus:ring-1 focus:ring-blue-500">
                <option value="">Барлығы</option>
                ${state.events.map(e => `<option value="${e.id}" ${activeDiplomaFilters.event === e.id ? 'selected' : ''}>${e.title}</option>`).join('')}
              </select>
            </div>
            <div class="flex-1 min-w-[200px]">
              <label class="block text-[10px] font-semibold text-slate-500 uppercase mb-1">Оқушы бойынша</label>
              <select onchange="activeDiplomaFilters.student = this.value; renderApp();" class="w-full text-sm p-2 border border-slate-200 rounded-lg bg-slate-50 focus:outline-none focus:ring-1 focus:ring-blue-500">
                <option value="">Барлығы</option>
                ${state.students.map(s => `<option value="${s.id}" ${activeDiplomaFilters.student === s.id ? 'selected' : ''}>${s.name}</option>`).join('')}
              </select>
            </div>
            <div class="w-40">
              <label class="block text-[10px] font-semibold text-slate-500 uppercase mb-1">Орын</label>
              <select onchange="activeDiplomaFilters.place = this.value; renderApp();" class="w-full text-sm p-2 border border-slate-200 rounded-lg bg-slate-50 focus:outline-none focus:ring-1 focus:ring-blue-500">
                <option value="">Барлығы</option>
                <option value="Бас жүлде" ${activeDiplomaFilters.place === 'Бас жүлде' ? 'selected' : ''}>Бас жүлде</option>
                <option value="I орын" ${activeDiplomaFilters.place === 'I орын' ? 'selected' : ''}>I орын</option>
                <option value="II орын" ${activeDiplomaFilters.place === 'II орын' ? 'selected' : ''}>II орын</option>
                <option value="III орын" ${activeDiplomaFilters.place === 'III орын' ? 'selected' : ''}>III орын</option>
                <option value="Сертификат" ${activeDiplomaFilters.place === 'Сертификат' ? 'selected' : ''}>Сертификат</option>
              </select>
            </div>
          </div>

          <!-- Дипломдар торы -->
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">
            ${filteredDiplomas.map(dip => {
              const student = state.students.find(s => s.id === dip.studentId);
              const event = state.events.find(e => e.id === dip.eventId);
              const isPdf = dip.fileType === 'application/pdf' || dip.fileName?.endsWith('.pdf');
              
              let placeColor = 'bg-slate-100 text-slate-600';
              if (dip.place === 'I орын' || dip.place === 'Бас жүлде') placeColor = 'bg-amber-100 text-amber-800 border-amber-200';
              else if (dip.place === 'II орын') placeColor = 'bg-slate-200 text-slate-700 border-slate-300';
              else if (dip.place === 'III орын') placeColor = 'bg-orange-100 text-orange-800 border-orange-200';

              return `
                <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden flex flex-col hover:shadow-md transition-shadow group relative">
                  <div class="h-32 bg-slate-100 flex items-center justify-center border-b border-slate-200 relative overflow-hidden">
                    <div class="absolute inset-0 bg-cover bg-center opacity-30" id="preview-bg-${dip.id}"></div>
                    <i class="fa-solid ${isPdf ? 'fa-file-pdf text-rose-500' : 'fa-file-image text-blue-500'} text-4xl z-10"></i>
                    
                    ${dip.diplomaNumber ? `
                      <span class="absolute top-2 left-2 px-2 py-0.5 bg-slate-800/80 text-white rounded text-[10px] font-mono z-20 backdrop-blur-sm">
                        ${dip.diplomaNumber}
                      </span>
                    ` : ''}

                    ${state.currentUser.role === 'ADMIN' ? `
                      <button onclick="deleteDiploma('${dip.id}')" class="absolute top-2 right-2 w-7 h-7 bg-white/80 hover:bg-rose-50 hover:text-rose-600 rounded-full text-slate-500 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity z-20 backdrop-blur-sm shadow-sm">
                        <i class="fa-solid fa-trash-can text-[10px]"></i>
                      </button>
                    ` : ''}
                  </div>
                  
                  <div class="p-4 flex-1 flex flex-col">
                    <div class="flex justify-between items-start mb-2">
                      <span class="px-2 py-0.5 rounded text-[10px] font-bold border ${placeColor}">
                        ${dip.place}
                      </span>
                      <span class="text-[10px] text-slate-400">${dip.issueDate}</span>
                    </div>
                    
                    <h3 class="font-bold text-slate-800 text-sm mb-1 line-clamp-1">${student?.name || 'Белгісіз'}</h3>
                    <p class="text-xs text-slate-500 mb-4 line-clamp-2 flex-1">${event?.title || 'Белгісіз іс-шара'}</p>
                    
                    <button onclick="downloadDiploma('${dip.id}', '${dip.fileName}')" class="w-full py-2 bg-blue-50 hover:bg-blue-100 text-blue-700 text-xs font-semibold rounded-xl border border-blue-200 transition-colors flex items-center justify-center">
                      <i class="fa-solid fa-download mr-1.5"></i> ${isPdf ? 'PDF жүктеу' : 'Суретті жүктеу'}
                    </button>
                  </div>
                </div>
              `;
            }).join('')}
            ${filteredDiplomas.length === 0 ? `<div class="col-span-full p-12 text-center text-slate-500 bg-white rounded-2xl border border-slate-200 border-dashed">Дипломдар табылмады</div>` : ''}
          </div>
        </div>
      `;
    }

    function renderDiplomaTemplatesTab() {
      return `
        <div class="space-y-6">
          <div class="flex justify-between items-center bg-white p-4 rounded-2xl border border-slate-200">
            <div>
              <h3 class="font-bold text-slate-800 text-sm">Шаблондар базасы</h3>

            </button>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
            ${(state.diplomaTemplates || []).map(tpl => `
              <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-4 flex flex-col justify-between hover:border-blue-300 transition-colors">
                <div>
                  <div class="flex justify-between items-start mb-2">
                    <span class="px-2 py-0.5 bg-blue-50 text-blue-700 rounded text-[10px] font-bold uppercase tracking-wider">
                      ${tpl.eventType}

                    <span class="text-[10px] text-slate-400 font-medium">${tpl.academicYear}</span>

                  <h4 class="font-bold text-slate-800 text-base mb-2">${tpl.title}</h4>

                <div class="flex space-x-2 pt-3 border-t border-slate-100">
                  <button onclick="openTemplateEditorModal('${tpl.id}')" class="flex-1 py-2 bg-slate-100 hover:bg-blue-50 hover:text-blue-700 text-slate-700 rounded-xl text-xs font-semibold transition-colors flex items-center justify-center">
                    <i class="fa-solid fa-sliders mr-1.5"></i> Баптау (Editor)
                  </button>
                  <button onclick="deleteTemplate('${tpl.id}')" class="p-2 text-rose-500 hover:bg-rose-50 rounded-xl transition-colors">
                    <i class="fa-solid fa-trash-can text-sm"></i>
                  </button>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderDiplomaGenerateTab() {
      const templates = state.diplomaTemplates || [];
      const students = state.students || [];
      const events = state.events || [];

      return `
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
          <!-- Сол жақ: Форма -->
          <div class="lg:col-span-5 bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4">
            <h3 class="font-bold text-slate-800 text-base border-b border-slate-100 pb-3">Диплом деректері</h3>
            
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Шаблон таңдау</label>
              <select id="gen-template-id" onchange="updateDiplomaPreview()" class="w-full p-2.5 border border-slate-300 rounded-xl text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white">
                ${templates.map(t => `<option value="${t.id}">${t.title} (${t.eventType})</option>`).join('')}
              </select>
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Оқушыны таңдау</label>
              <select id="gen-student-id" onchange="updateDiplomaPreview()" class="w-full p-2.5 border border-slate-300 rounded-xl text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white">
                ${students.map(s => `<option value="${s.id}">${s.name} (${s.grade} сынып)</option>`).join('')}
              </select>
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Іс-шараны таңдау</label>
              <select id="gen-event-id" onchange="updateDiplomaPreview()" class="w-full p-2.5 border border-slate-300 rounded-xl text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white">
                ${events.map(e => `<option value="${e.id}">${e.title}</option>`).join('')}
              </select>
            </div>

            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Орын/Нәтиже</label>
                <select id="gen-place" onchange="updateDiplomaPreview()" class="w-full p-2.5 border border-slate-300 rounded-xl text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white">
                  <option value="Бас жүлде">Бас жүлде</option>
                  <option value="I орын" selected>I орын</option>
                  <option value="II орын">II орын</option>
                  <option value="III орын">III орын</option>
                  <option value="Арнайы жүлде">Арнайы жүлде</option>
                  <option value="Сертификат">Сертификат</option>
                </select>
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Берілген күні</label>
                <input type="date" id="gen-date" value="${new Date().toISOString().split('T')[0]}" onchange="updateDiplomaPreview()" class="w-full p-2.5 border border-slate-300 rounded-xl text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none">
              </div>
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Авто-диплом нөмірі</label>
              <input type="text" id="gen-number" value="${generateNextDiplomaNumber()}" readonly class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-mono text-slate-600">
            </div>

            <div class="pt-3">
              <button onclick="executeSingleDiplomaGeneration()" id="btn-generate-single" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl text-xs transition-colors shadow-lg shadow-blue-500/20 flex items-center justify-center">
                <i class="fa-solid fa-wand-magic-sparkles mr-2"></i> Диплом жасау және Сақтау (PDF)
              </button>
            </div>
          </div>

          <!-- Оң жақ: Алдын ала қарау (Preview Canvas) -->
          <div class="lg:col-span-7 bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-between">
            <div>
              <div class="flex justify-between items-center border-b border-slate-100 pb-3 mb-4">
                <h3 class="font-bold text-slate-800 text-base">Алдын ала қарау (Live Preview)</h3>
                <span class="text-xs text-blue-600 bg-blue-50 px-2.5 py-1 rounded-full font-medium">Авто-масштаб</span>
              </div>
              
              <div class="bg-slate-100 p-3 rounded-xl flex items-center justify-center overflow-hidden border border-slate-200 min-h-[320px]">
                <canvas id="diplomaPreviewCanvas" class="max-w-full h-auto rounded shadow-sm border border-slate-300"></canvas>
              </div>

            <p class="text-[11px] text-slate-400 mt-3 text-center">
              <i class="fa-solid fa-info-circle mr-1"></i> Диплом PDF форматында шаблонның түпнұсқа сапасы бойынша жасалады.
            </p>

        </div>

    function renderDiplomaBulkTab() {
      const templates = state.diplomaTemplates || [];
      const events = state.events || [];

      return `
        <div class="space-y-6">
          <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4">
            <h3 class="font-bold text-slate-800 text-base">Топтық диплом генераторы</h3>
            <p class="text-xs text-slate-500">Іс-шараның барлық қатысушыларына бір мезетте жеке дипломдар әзірлеу</p>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Іс-шараны таңдау</label>
                <select id="bulk-event-id" onchange="renderBulkStudentTable()" class="w-full p-2.5 border border-slate-300 rounded-xl text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white">
                  <option value="">Таңдаңыз...</option>
                  ${events.map(e => `<option value="${e.id}">${e.title}</option>`).join('')}
                </select>
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Шаблонды таңдау</label>
                <select id="bulk-template-id" class="w-full p-2.5 border border-slate-300 rounded-xl text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white">
                  ${templates.map(t => `<option value="${t.id}">${t.title}</option>`).join('')}
                </select>
              </div>
            </div>
          </div>

          <div id="bulk-student-table-container" class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden p-5">
            <div class="text-center py-8 text-slate-400 text-xs">Жоғарыдағы іс-шараны таңдаңыз</div>
          </div>
        </div>
      `;
    }

    function renderBulkStudentTable() {
      const eventId = document.getElementById('bulk-event-id').value;
      const container = document.getElementById('bulk-student-table-container');

      if (!eventId) {
        container.innerHTML = `<div class="text-center py-8 text-slate-400 text-xs">Жоғарыдағы іс-шараны таңдаңыз</div>`;
        return;
      }

      // Іс-шараға қатысқан немесе Мақұлданған оқушыларды аламыз
      const apps = state.applications.filter(a => a.eventId === eventId && a.status === 'APPROVED');
      const studentList = apps.map(app => state.students.find(s => s.id === app.studentId)).filter(Boolean);

      if (studentList.length === 0) {
        container.innerHTML = `<div class="text-center py-8 text-slate-500 text-xs">Бұл іс-шара бойынша мақұлданған қатысушы оқушылар табылмады</div>`;
        return;
      }

      container.innerHTML = `
        <div class="space-y-4">
          <div class="flex justify-between items-center">
            <span class="font-bold text-slate-800 text-sm">Қатысушылар тізімі (${studentList.length} оқушы)</span>

    function updateFieldParam(param, val) {
      if (activeEditingTemplate && activeEditingTemplate.fields[selectedFieldKey]) {

      }
    }

    function handleEditorCanvasClick(event) {
      const canvas = document.getElementById('templateEditorCanvas');
      if (!canvas) return;

      const rect = canvas.getBoundingClientRect();
      const clickX = event.clientX - rect.left;
      const clickY = event.clientY - rect.top;

      const normX = clickX / canvas.clientWidth;
      const normY = clickY / canvas.clientHeight;

      if (activeEditingTemplate && activeEditingTemplate.fields[selectedFieldKey]) {
        activeEditingTemplate.fields[selectedFieldKey].x = Math.max(0, Math.min(1, normX));
        activeEditingTemplate.fields[selectedFieldKey].y = Math.max(0, Math.min(1, normY));
        renderFieldControls();
        redrawEditorCanvas();
      }
    }

    async function redrawEditorCanvas() {
      const canvas = document.getElementById('templateEditorCanvas');
      if (!canvas || !activeEditingTemplate) return;

      const ctx = canvas.getContext('2d');
      canvas.width = 1000;
      canvas.height = 700;

      // Фонолық бейнені салу
      let bgImg = null;
      try {
        const fileBlob = await idbHelper.getFile(activeEditingTemplate.id);
        if (fileBlob) {
          bgImg = await new Promise((resolve) => {
            const img = new Image();
            img.onload = () => resolve(img);
            img.src = URL.createObjectURL(fileBlob);
          });
        }
      } catch (e) {}

      if (bgImg) {
        ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
      } else {
        ctx.fillStyle = '#f8fafc';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = '#3b82f6';
        ctx.lineWidth = 8;
        ctx.strokeRect(20, 20, canvas.width - 40, canvas.height - 40);
      }

      // Тізімдегі барлық маркерлерді салу
      Object.keys(activeEditingTemplate.fields).forEach(key => {
        const field = activeEditingTemplate.fields[key];
        if (!field.active) return;

        const isSelected = key === selectedFieldKey;
        const x = field.x * canvas.width;
        const y = field.y * canvas.height;

        ctx.fillStyle = isSelected ? '#2563eb' : '#64748b';
        ctx.font = `${isSelected ? 'bold' : 'normal'} ${field.fontSize}px Inter, sans-serif`;
        ctx.textAlign = field.textAlign || 'center';
        ctx.textBaseline = 'middle';
        
        ctx.fillText(`{{${key}}}`, x, y);

        // Белгілеу шеңбері
        ctx.beginPath();
        ctx.arc(x, y, 6, 0, Math.PI * 2);
        ctx.fillStyle = isSelected ? '#ef4444' : '#3b82f6';
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();
      });
    }

    async function executeSingleDiplomaGeneration() {
      const templateId = document.getElementById('gen-template-id').value;
      const studentId = document.getElementById('gen-student-id').value;
      const eventId = document.getElementById('gen-event-id').value;
      const place = document.getElementById('gen-place').value;
      const issueDate = document.getElementById('gen-date').value;
      const dipNum = document.getElementById('gen-number').value;

      const btn = document.getElementById('btn-generate-single');
      btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin mr-2"></i> Дайындалуда...`;
      btn.disabled = true;

      try {
        const template = state.diplomaTemplates.find(t => t.id === templateId);
        const student = state.students.find(s => s.id === studentId);
        const event = state.events.find(e => e.id === eventId);

        const canvas = await drawCertificateCanvas(template, student, event, place, issueDate, dipNum);
        const pdfBlob = await canvasToPdfBlob(canvas);

        const dipId = 'dip_' + Date.now();
        const fileName = `Diploma_${student.name.replace(/\s+/g, '_')}_${place.replace(/\s+/g, '_')}.pdf`;

        await idbHelper.saveFile(dipId, pdfBlob);

        const newDiploma = {
          id: dipId,
          diplomaNumber: dipNum,
          studentId: student.id,
          supervisorId: student.supervisorId,
          eventId: event.id,
          place: place,
          issueDate: issueDate,
          fileName: fileName,
          fileType: 'application/pdf',
          generated: true,
          templateId: template.id
        };

        // Google Drive: upload the FINAL PDF (including the QR) and store its Drive URL.
        // The QR itself points to the stable Apps Script resolver by diploma number, which redirects to this Drive PDF.
        if (gsAuthUrl()) {
          const driveResult = await gsUploadDiplomaPdf(pdfBlob, newDiploma);
          newDiploma.driveFileId = driveResult.fileId || '';
          newDiploma.driveUrl = driveResult.driveUrl || '';
          newDiploma.driveUploaded = true;
        }

        state.diplomas.unshift(newDiploma);
        saveState();

        addNotification(`Диплом дайындалды: ${student.name} (${place})`);
        activeDiplomaTab = 'list';
        renderApp();
      } catch (err) {
        console.error("Diploma gen error:", err);
        alert("Қате пайда болды: " + err.message);
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-wand-magic-sparkles mr-2"></i> Диплом жасау және Сақтау (PDF)`;
      }
    }

    async function executeBulkDiplomaGeneration() {
      const eventId = document.getElementById('bulk-event-id').value;
      const templateId = document.getElementById('bulk-template-id').value;

      if (!eventId || !templateId) return;

      const template = state.diplomaTemplates.find(t => t.id === templateId);
      const event = state.events.find(e => e.id === eventId);
      const selectEls = document.querySelectorAll('.bulk-place-select');

      const btn = document.getElementById('btn-bulk-generate');
      btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin mr-2"></i> Өңделуде...`;
      btn.disabled = true;

      const generatedIds = [];

      try {
        for (let el of selectEls) {
          const studentId = el.getAttribute('data-student-id');
          const place = el.value;
          const student = state.students.find(s => s.id === studentId);
          if (!student) continue;

          const dipNum = generateNextDiplomaNumber();
          const issueDate = new Date().toISOString().split('T')[0];

          const canvas = await drawCertificateCanvas(template, student, event, place, issueDate, dipNum);
          const pdfBlob = await canvasToPdfBlob(canvas);

          const dipId = 'dip_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
          const fileName = `${student.name.replace(/\s+/g, '_')}_${place.replace(/\s+/g, '_')}.pdf`;

          await idbHelper.saveFile(dipId, pdfBlob);

          const newDiploma = {
            id: dipId,
            diplomaNumber: dipNum,
            studentId: student.id,
            supervisorId: student.supervisorId,
            eventId: event.id,
            place: place,
            issueDate: issueDate,
            fileName: fileName,
            fileType: 'application/pdf',
            generated: true,
            templateId: template.id
          };

          state.diplomas.unshift(newDiploma);
          generatedIds.push(dipId);
        }

        saveState();
        addNotification(`Топтық диплом аяқталды: ${generatedIds.length} диплом жасалды`);

        // ZIP ретінде де жүктеу батырмасын ұсынамыз
        if (confirm(`${generatedIds.length} диплом PDF форматында жасалды. Барлық файлдарды ZIP ретінде жүктейсіз бе?`)) {
          await downloadDiplomasAsZip(generatedIds, `${event.title}_Дипломдар.zip`);
        }

        activeDiplomaTab = 'list';
        renderApp();
      } catch (err) {
        console.error("Bulk gen error:", err);
        alert("Топтық генерация қатесі: " + err.message);
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-gears mr-2"></i> Барлығына диплом жасау`;
      }
    }

    async function downloadDiplomasAsZip(dipIds, zipName = 'Diplomas.zip') {
      const { JSZip } = window;
      const zip = new JSZip();

      for (let id of dipIds) {
        const dip = state.diplomas.find(d => d.id === id);
        if (!dip) continue;

        const blob = await idbHelper.getFile(id);
        if (blob) {
          zip.file(dip.fileName, blob);
        }
      }

      const zipBlob = await zip.generateAsync({ type: "blob" });
      const url = URL.createObjectURL(zipBlob);
      const a = document.createElement('a');
      a.href = url;
      a.download = zipName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    async function handleDiplomaSubmit(event) {
      event.preventDefault();
      const fileInput = document.getElementById('dip-file');
      if (!fileInput.files || fileInput.files.length === 0) return;
      
      const file = fileInput.files[0];
      const btn = document.getElementById('dip-submit-btn');
      const studentId = document.getElementById('dip-student').value;
      const student = state.students.find(s => s.id === studentId);
      
      const newDiploma = {
        id: 'dip_' + Date.now(),
        diplomaNumber: generateNextDiplomaNumber(),
        studentId: studentId,
        supervisorId: student ? student.supervisorId : null,
        eventId: document.getElementById('dip-event').value,
        place: document.getElementById('dip-place').value,
        issueDate: document.getElementById('dip-date').value,
        fileName: file.name,
        fileType: file.type,
        generated: false
      };

      try {
        btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin mr-2"></i> Жүктелуде...`;
        btn.disabled = true;
        
        await idbHelper.saveFile(newDiploma.id, file);
        state.diplomas.unshift(newDiploma);
        saveState();
        
        addNotification(`Жаңа диплом тіркелді: ${file.name}`);
        closeModal();
        renderApp();
      } catch (err) {
        console.error("Diploma upload error:", err);
        btn.disabled = false;
        alert("Қате орын алды: " + err.message);
      }
    }

    async function downloadDiploma(dipId, fileName) {
      try {
        const fileBlob = await idbHelper.getFile(dipId);
        if (!fileBlob) return;
        const url = URL.createObjectURL(fileBlob);
        const a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (err) {
        console.error("Download error:", err);
      }
    }

    async function deleteDiploma(dipId) {
      if (confirm("Бұл дипломды жоюға сенімдісіз бе?")) {
        try {
          await idbHelper.deleteFile(dipId);
          state.diplomas = state.diplomas.filter(d => d.id !== dipId);
          saveState();
          renderApp();
        } catch (err) {
          console.error("Delete error:", err);
        }
      }
    }

        saveState();
        addNotification(`Өтінім статусы жаңартылды: ${STATUS_LABELS[newStatus]}`);

    }

    // ================= DARYNHUB V2 EXTENSION =================
    const V2_PROJECT_STAGES = ['Тақырып','Зерттеу сұрағы','Гипотеза','Әдебиеттер','Әдістеме','Эксперимент','Деректер жинау','Талдау','Жоба мәтіні','Презентация','Қорғау'];
    const V2_PLACES = ['Бас жүлде','I орын','II орын','III орын','Арнайы жүлде','Қатысушы'];
    const V2_YEARS = ['2025-2026','2026-2027'];
    let v2Filters = {analytics:{year:'',teacher:'',subject:'',level:'',place:''}, archive:false};
    let v2SearchTimer = null;
    let v2Charts = [];

    function v2MigrateState(){
      state.practiceTests ||= [];
      state.olympiadPreparations ||= [];
      state.academicYears ||= V2_YEARS;
      state.currentAcademicYear ||= '2026-2027';
      state.reports ||= [];
      state.settings ||= {schoolName:'№1 Абай атындағы лицей'};
      state.students.forEach(s=>{ if(s.archived===undefined)s.archived=false; });
      state.events.forEach(e=>{ if(e.archived===undefined)e.archived=false; e.academicYear ||= inferAcademicYear(e.date); });
      state.applications.forEach(a=>a.academicYear ||= inferAcademicYear(a.date));
      state.achievements.forEach(a=>a.academicYear ||= inferAcademicYear(a.date));
      state.projects.forEach(p=>{ p.academicYear ||= state.currentAcademicYear; p.stages ||= V2_PROJECT_STAGES.map((name,i)=>({name,done:(p.progress||0) >= Math.round(((i+1)/11)*100)})); p.supervisorId ||= state.students.find(s=>s.id===p.studentId)?.supervisorId || null; });
      state.diplomas.forEach(d=>d.academicYear ||= inferAcademicYear(d.issueDate));
      saveState();
    }
    function inferAcademicYear(dateStr){ const d=dateStr?new Date(dateStr+'T00:00:00'):new Date(); const y=d.getFullYear(); const m=d.getMonth()+1; return m>=8?`${y}-${y+1}`:`${y-1}-${y}`; }
    function escapeHtml(v){ return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
    function v2Toast(msg,type='success'){ const old=document.getElementById('v2-toast'); if(old)old.remove(); const el=document.createElement('div'); el.id='v2-toast'; el.className=`fixed bottom-5 right-5 z-[100] px-4 py-3 rounded-xl shadow-xl text-sm font-semibold ${type==='error'?'bg-rose-600':'bg-slate-900'} text-white`; el.textContent=msg; document.body.appendChild(el); setTimeout(()=>el.remove(),2600); }
    function v2TeacherStudents(){ return state.students.filter(s=>s.supervisorId===state.currentUser.id && !s.archived); }
    function v2VisibleStudents(){ return state.currentUser.role==='ADMIN'?state.students.filter(s=>v2Filters.archive?true:!s.archived):v2TeacherStudents(); }
    function v2VisibleProjects(){ return state.currentUser.role==='ADMIN'?state.projects:state.projects.filter(p=>p.supervisorId===state.currentUser.id); }
    function v2DeadlineDays(date){ if(!date)return null; const a=new Date();a.setHours(0,0,0,0);const b=new Date(date+'T00:00:00');return Math.ceil((b-a)/86400000); }
    function v2DeadlineBadge(date){ const d=v2DeadlineDays(date); if(d===null)return ''; if(d<0)return '<span class="text-rose-600 font-semibold">Мерзімі өтті</span>'; const c=d<=3?'text-rose-600':d<=7?'text-amber-600':'text-emerald-600'; return `<span class="${c} font-semibold">${d} күн қалды</span>`; }
    function v2CheckDeadlineNotifications(){
      const candidates=[]; state.events.filter(e=>!e.archived).forEach(e=>{const d=v2DeadlineDays(e.deadline);if(d>=0&&d<=3)candidates.push({key:`event-${e.id}-${d}`,message:`${e.title}: өтінім аяқталуына ${d} күн қалды.`});});
      v2VisibleProjects().forEach(p=>{const d=v2DeadlineDays(p.deadline);if(d>=0&&d<=7)candidates.push({key:`project-${p.id}-${d}`,message:`${p.title}: ғылыми жоба deadline-ына ${d} күн қалды.`});});
      let changed=false; candidates.forEach(c=>{if(!state.notifications.some(n=>n.key===c.key)){state.notifications.unshift({id:Date.now()+Math.random(),key:c.key,message:c.message,read:false,time:'Автоматты'});changed=true;}}); if(changed)saveState();
    }
    const DH_UI_KEY='darynhub_ui_prefs';
    let dhUi=(()=>{try{return {...{lang:'kk',dark:false},...JSON.parse(localStorage.getItem(DH_UI_KEY)||'{}')}}catch(_){return {lang:'kk',dark:false}}})();

    function renderSidebar(){ const navItems=v2NavItems(); return `<aside class="hidden md:flex flex-col w-64 bg-white border-r border-slate-200 sticky top-0 h-screen z-20"><div class="h-16 flex items-center px-6 border-b"><div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white mr-3"><i class="fa-solid fa-trophy"></i></div><span class="text-xl font-bold">DarynHub <small class="text-blue-600 text-[10px]">V2</small></span></div><nav class="flex-1 px-4 py-5 space-y-1 overflow-y-auto custom-scrollbar">${navItems.map(i=>`<button onclick="switchView('${i.id}')" class="w-full flex items-center px-3.5 py-2.5 rounded-xl text-sm ${currentView===i.id?'bg-blue-50 text-blue-700 font-semibold':'text-slate-600 hover:bg-slate-100'}"><i class="fa-solid ${i.icon} w-6 mr-2"></i><span class="flex-1 text-left">${dhT(i.label)}</span>${i.id==='applications'&&dhPendingApps()>0?`<span class="ml-auto min-w-5 h-5 px-1.5 rounded-full bg-rose-500 text-white text-[10px] flex items-center justify-center">${dhPendingApps()}</span>`:''}</button>`).join('')}</nav><div class="p-4 border-t"><div class="text-xs font-semibold mb-2 truncate">${escapeHtml(state.currentUser.name)}</div><button onclick="logoutUser()" class="w-full py-2 text-xs text-rose-600 hover:bg-rose-50 rounded-lg"><i class="fa-solid fa-right-from-bracket mr-2"></i>Жүйеден шығу</button></div></aside>`; }

    function v2RenderOlympiad(){ const students=v2VisibleStudents(); const preps=state.currentUser.role==='ADMIN'?state.olympiadPreparations:state.olympiadPreparations.filter(p=>p.teacherId===state.currentUser.id); return `<div class="space-y-5"><div class="flex justify-between"><div><h2 class="text-2xl font-bold">Олимпиада дайындығы</h2><p class="text-sm text-slate-500">Тақырыптық прогресс және сынақ диагностикасы</p></div><button onclick="v2OpenPrepModal()" class="px-4 py-2 bg-blue-600 text-white rounded-xl text-xs font-semibold">+ Дайындық жоспары</button></div>${preps.map(p=>{const s=state.students.find(x=>x.id===p.studentId);const tests=state.practiceTests.filter(t=>t.prepId===p.id);const avg=tests.length?Math.round(tests.reduce((a,t)=>a+t.percent,0)/tests.length):0;return `<div class="bg-white border rounded-2xl p-5"><div class="flex justify-between"><div><b>${escapeHtml(s?.name||'')}</b><div class="text-xs text-slate-500">${escapeHtml(p.subject)} • ${escapeHtml(p.target||'')}</div></div><button onclick="v2OpenTestModal('${p.id}')" class="text-xs px-3 py-2 bg-slate-900 text-white rounded-lg">+ Сынақ нәтижесі</button></div><div class="grid sm:grid-cols-4 gap-3 mt-4">${Object.entries(p.topics||{}).map(([k,v])=>`<div><div class="flex justify-between text-xs"><span>${escapeHtml(k)}</span><b>${v}%</b></div><div class="h-2 bg-slate-100 rounded"><div class="h-2 bg-blue-500 rounded" style="width:${v}%"></div></div></div>`).join('')}</div><div class="mt-4 text-xs bg-slate-50 p-3 rounded-xl">Орташа нәтиже: <b>${avg}%</b> • Сынақ саны: ${tests.length} ${v2DiagnosticText(tests)}</div></div>`}).join('')||'<div class="p-10 bg-white border rounded-2xl text-center text-slate-400">Дайындық жоспары жоқ</div>'}</div>`; }
    function v2DiagnosticText(tests){ if(!tests.length)return ''; const by={};tests.forEach(t=>(by[t.topic]||=[]).push(t.percent));const av=Object.entries(by).map(([k,a])=>[k,Math.round(a.reduce((x,y)=>x+y,0)/a.length)]).sort((a,b)=>b[1]-a[1]);return av.length?`• Күшті: <b>${escapeHtml(av[0][0])} ${av[0][1]}%</b> • Назар: <b>${escapeHtml(av[av.length-1][0])} ${av[av.length-1][1]}%</b>`:''; }

    function v2SavePrep(e){e.preventDefault();const topics={};document.getElementById('v2-prep-topics').value.split(',').forEach(x=>{const [k,v]=x.split(':');if(k)topics[k.trim()]=Math.max(0,Math.min(100,Number(v)||0));});state.olympiadPreparations.unshift({id:'op'+Date.now(),studentId:document.getElementById('v2-prep-st').value,teacherId:state.currentUser.id,subject:document.getElementById('v2-prep-sub').value,target:document.getElementById('v2-prep-target').value,startDate:document.getElementById('v2-prep-start').value,academicYear:state.currentAcademicYear,topics});saveState();closeModal();renderApp();v2Toast('Дайындық жоспары сақталды');}
    function v2OpenTestModal(prepId){document.getElementById('modal-container').innerHTML=`<div class="fixed inset-0 z-50 bg-slate-900/50 flex items-center justify-center p-4"><form onsubmit="v2SaveTest(event,'${prepId}')" class="bg-white rounded-2xl p-6 w-full max-w-md space-y-3"><h3 class="font-bold">Сынақ нәтижесі</h3><input id="v2-test-topic" required placeholder="Тақырып" class="w-full border p-2 rounded-xl"><input id="v2-test-date" type="date" value="${new Date().toISOString().slice(0,10)}" class="w-full border p-2 rounded-xl"><div class="grid grid-cols-2 gap-2"><input id="v2-test-max" type="number" min="1" required placeholder="Макс. балл" class="border p-2 rounded-xl"><input id="v2-test-score" type="number" min="0" required placeholder="Алған балл" class="border p-2 rounded-xl"></div><textarea id="v2-test-note" placeholder="Мұғалім пікірі" class="w-full border p-2 rounded-xl"></textarea><button class="w-full bg-blue-600 text-white py-2 rounded-xl">Сақтау</button></form></div>`;}
    function v2SaveTest(e,prepId){e.preventDefault();const max=Number(document.getElementById('v2-test-max').value),score=Number(document.getElementById('v2-test-score').value);if(score>max)return v2Toast('Алған балл максималды баллдан аспауы керек','error');state.practiceTests.unshift({id:'pt'+Date.now(),prepId,topic:document.getElementById('v2-test-topic').value,date:document.getElementById('v2-test-date').value,max,score,percent:Math.round(score/max*100),note:document.getElementById('v2-test-note').value});saveState();closeModal();renderApp();}

    function v2RenderProjects(){ const projects=v2VisibleProjects(); projects.forEach(p=>{if(!Array.isArray(p.stages)||!p.stages.length)p.stages=V2_PROJECT_STAGES.map(name=>({name,done:false}));}); return `<div class="space-y-5"><div class="flex justify-between"><div><h2 class="text-2xl font-bold">${dhT('Ғылыми жобалар')}</h2><p class="text-sm text-slate-500">11 кезең бойынша зерттеу прогресі</p></div><button onclick="v2OpenProjectModal()" class="px-4 py-2 bg-blue-600 text-white rounded-xl text-xs font-semibold">+ ${dhT('Ғылыми жоба')}</button></div><div class="grid md:grid-cols-2 gap-4">${projects.map(p=>{const st=state.students.find(x=>x.id===p.studentId);const done=(p.stages||[]).filter(x=>x.done).length;const prog=p.stages?.length?Math.round(done/p.stages.length*100):(p.progress||0);return `<div class="bg-white border rounded-2xl p-5"><div class="flex justify-between gap-3"><div><b>${escapeHtml(p.title)}</b><div class="text-xs text-slate-500">${escapeHtml(st?.name||'')} • ${escapeHtml(p.subject||'')}</div></div><div class="flex items-start gap-2"><span class="text-sm font-bold text-blue-600">${prog}%</span><button onclick="v2OpenProjectModal('${p.id}')" class="text-slate-500 hover:text-blue-600" title="Өңдеу"><i class="fa-solid fa-pen"></i></button></div></div><div class="h-2 bg-slate-100 rounded mt-3"><div class="h-2 bg-blue-500 rounded" style="width:${prog}%"></div></div><div class="mt-4 grid grid-cols-2 gap-2">${(p.stages||[]).map((x,i)=>`<label class="text-xs flex gap-2 items-center"><input type="checkbox" ${x.done?'checked':''} ${state.currentUser?.role==='ADMIN'?'': 'disabled'} onchange="v2ToggleStage('${p.id}',${i},this.checked)">${escapeHtml(x.name)}</label>`).join('')}</div><div class="mt-4 text-xs">Deadline: ${p.deadline||'-'} ${v2DeadlineBadge(p.deadline)}</div></div>`}).join('')||'<div class="p-10 bg-white border rounded-2xl text-slate-400">Жоба жоқ</div>'}</div></div>`; }
    function v2OpenProjectModal(projectId=''){const sts=v2VisibleStudents(),p=projectId?state.projects.find(x=>x.id===projectId):null;document.getElementById('modal-container').innerHTML=`<div class="fixed inset-0 z-50 bg-slate-900/50 flex items-center justify-center p-4"><form onsubmit="v2SaveProject(event,'${projectId}')" class="bg-white rounded-2xl p-6 w-full max-w-2xl max-h-[90vh] overflow-y-auto space-y-3"><div class="flex justify-between"><h3 class="font-bold text-lg">${p?'Ғылыми жобаны өңдеу':'Ғылыми жоба қосу'}</h3><button type="button" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button></div><select id="v2-pr-st" class="w-full border p-2 rounded-xl">${sts.map(x=>`<option value="${x.id}" ${p?.studentId===x.id?'selected':''}>${escapeHtml(x.name)}</option>`).join('')}</select><input id="v2-pr-title" required value="${escapeHtml(p?.title||'')}" placeholder="Жоба тақырыбы" class="w-full border p-2 rounded-xl"><div class="grid grid-cols-2 gap-2"><input id="v2-pr-sub" value="${escapeHtml(p?.subject||'')}" placeholder="Пән" class="border p-2 rounded-xl"><input id="v2-pr-cat" value="${escapeHtml(p?.category||'')}" placeholder="Категория" class="border p-2 rounded-xl"></div><textarea id="v2-pr-q" placeholder="Зерттеу сұрағы" class="w-full border p-2 rounded-xl">${escapeHtml(p?.researchQuestion||'')}</textarea><textarea id="v2-pr-h" placeholder="Гипотеза" class="w-full border p-2 rounded-xl">${escapeHtml(p?.hypothesis||'')}</textarea><textarea id="v2-pr-desc" placeholder="Сипаттама" class="w-full border p-2 rounded-xl">${escapeHtml(p?.description||'')}</textarea><div class="grid grid-cols-2 gap-2"><input id="v2-pr-start" type="date" value="${p?.startDate||''}" class="border p-2 rounded-xl"><input id="v2-pr-dead" type="date" value="${p?.deadline||''}" class="border p-2 rounded-xl"></div><button class="w-full bg-blue-600 text-white py-2 rounded-xl">${p?'Өзгерістерді сақтау':'Сақтау'}</button></form></div>`;}
    function v2SaveProject(e,projectId=''){e.preventDefault();const studentId=document.getElementById('v2-pr-st').value,st=state.students.find(s=>s.id===studentId);let p=projectId?state.projects.find(x=>x.id===projectId):null;if(!p){p={id:'p'+Date.now(),stages:V2_PROJECT_STAGES.map(name=>({name,done:false})),academicYear:state.currentAcademicYear};state.projects.unshift(p);}Object.assign(p,{studentId,supervisorId:st?.supervisorId||state.currentUser.id,title:document.getElementById('v2-pr-title').value,subject:document.getElementById('v2-pr-sub').value,category:document.getElementById('v2-pr-cat').value,researchQuestion:document.getElementById('v2-pr-q').value,hypothesis:document.getElementById('v2-pr-h').value,description:document.getElementById('v2-pr-desc').value,startDate:document.getElementById('v2-pr-start').value,deadline:document.getElementById('v2-pr-dead').value,status:p.status||'IN_PROGRESS'});saveState();closeModal();renderApp();v2Toast(projectId?'Ғылыми жоба жаңартылды':'Ғылыми жоба сақталды');telegramCloudSyncNow(false).catch(e=>console.warn('Project immediate sync:',e));}
    function v2ToggleStage(id,i,done){if(state.currentUser?.role!=='ADMIN'){v2Toast('Ғылыми жоба кезеңдерін тек Admin бағалайды','error');return;}const p=state.projects.find(x=>x.id===id);if(!p)return;if(!Array.isArray(p.stages)||!p.stages.length)p.stages=V2_PROJECT_STAGES.map(name=>({name,done:false}));if(!p.stages[i])return;p.stages[i].done=done;p.progress=Math.round(p.stages.filter(x=>x.done).length/p.stages.length*100);p.assessedBy=state.currentUser.id;p.assessedAt=new Date().toISOString();saveState();renderApp();telegramCloudSyncNow(false).catch(e=>console.warn('Project assessment sync:',e));}

    function v2RenderAchievements(){let list=state.currentUser.role==='ADMIN'?state.achievements:state.achievements.filter(a=>v2TeacherStudents().some(s=>s.id===a.studentId));return `<div class="space-y-5"><div class="flex justify-between"><div><h2 class="text-2xl font-bold">Жетістіктер</h2><p class="text-sm text-slate-500">Оқушы нәтижелері мен марапаттары</p></div><button onclick="v2OpenAchievementModal()" class="px-4 py-2 bg-blue-600 text-white rounded-xl text-xs">+ Жетістік қосу</button></div><div class="bg-white border rounded-2xl overflow-x-auto"><table class="w-full text-sm"><thead class="bg-slate-50"><tr><th class="p-3 text-left">Оқушы</th><th>Іс-шара</th><th>Пән</th><th>Деңгей</th><th>Нәтиже</th><th>Күні</th></tr></thead><tbody>${list.map(a=>{const s=state.students.find(x=>x.id===a.studentId),ev=state.events.find(x=>x.id===a.eventId);return `<tr class="border-t"><td class="p-3 font-semibold">${escapeHtml(s?.name||'')}</td><td>${escapeHtml(ev?.title||a.eventName||'')}</td><td>${escapeHtml(a.subject||'')}</td><td>${escapeHtml(a.level||'')}</td><td><b>${escapeHtml(a.place||'')}</b></td><td>${a.date||''}</td></tr>`}).join('')}</tbody></table></div></div>`;}
    function v2OpenAchievementModal(){const sts=v2VisibleStudents();document.getElementById('modal-container').innerHTML=`<div class="fixed inset-0 z-50 bg-slate-900/50 flex items-center justify-center p-4"><form onsubmit="v2SaveAchievement(event)" class="bg-white rounded-2xl p-6 w-full max-w-lg space-y-3"><h3 class="font-bold">Жетістік қосу</h3><select id="v2-ach-st" class="w-full border p-2 rounded-xl">${sts.map(s=>`<option value="${s.id}">${escapeHtml(s.name)}</option>`).join('')}</select><select id="v2-ach-ev" class="w-full border p-2 rounded-xl"><option value="">Іс-шарасыз</option>${state.events.map(e=>`<option value="${e.id}">${escapeHtml(e.title)}</option>`).join('')}</select><input id="v2-ach-sub" placeholder="Пән" class="w-full border p-2 rounded-xl"><select id="v2-ach-place" class="w-full border p-2 rounded-xl">${V2_PLACES.map(x=>`<option>${x}</option>`).join('')}</select><input id="v2-ach-date" type="date" value="${new Date().toISOString().slice(0,10)}" class="w-full border p-2 rounded-xl"><button class="w-full bg-blue-600 text-white py-2 rounded-xl">Сақтау</button></form></div>`;}
    function v2SaveAchievement(e){e.preventDefault();const studentId=document.getElementById('v2-ach-st').value,eventId=document.getElementById('v2-ach-ev').value,place=document.getElementById('v2-ach-place').value;if(state.achievements.some(a=>a.studentId===studentId&&a.eventId===eventId&&a.place===place))return v2Toast('Бұл жетістік бұрын тіркелген','error');const ev=state.events.find(x=>x.id===eventId);state.achievements.unshift({id:'ach'+Date.now(),studentId,eventId,type:ev?.type||'Басқа',level:ev?.level||'',place,subject:document.getElementById('v2-ach-sub').value,date:document.getElementById('v2-ach-date').value,academicYear:state.currentAcademicYear});saveState();closeModal();renderApp();}

    function v2RenderDeadlines(){const items=[];state.events.filter(e=>!e.archived).forEach(e=>items.push({type:'Іс-шара',title:e.title,date:e.deadline}));v2VisibleProjects().forEach(p=>items.push({type:'Ғылыми жоба',title:p.title,date:p.deadline}));return `<div class="space-y-5"><h2 class="text-2xl font-bold">Дедлайндар</h2><div class="bg-white border rounded-2xl divide-y">${items.filter(x=>x.date).sort((a,b)=>a.date.localeCompare(b.date)).map(x=>`<div class="p-4 flex justify-between"><div><b>${escapeHtml(x.title)}</b><div class="text-xs text-slate-500">${x.type} • ${x.date}</div></div>${v2DeadlineBadge(x.date)}</div>`).join('')||'<div class="p-8 text-center text-slate-400">Дедлайн жоқ</div>'}</div></div>`;}

    function v2AnalyticsData(){const year=v2Filters.analytics.year;const ach=state.achievements.filter(a=>!year||a.academicYear===year);const evs=state.events.filter(e=>!e.archived&&(!year||e.academicYear===year));const apps=state.applications.filter(a=>!year||a.academicYear===year);const projs=state.projects.filter(p=>!year||p.academicYear===year);const dips=state.diplomas.filter(d=>!year||d.academicYear===year);return{ach,evs,apps,projs,dips};}
    function v2RenderAnalytics(){const d=v2AnalyticsData();const talent={};state.students.filter(s=>!s.archived).forEach(s=>talent[s.direction]=(talent[s.direction]||0)+1);const teachers=state.users.filter(u=>u.role==='TEACHER');return `<div class="space-y-5"><div class="flex justify-between items-end"><div><h2 class="text-2xl font-bold">Аналитика</h2><p class="text-sm text-slate-500">Нақты сақталған деректер бойынша</p></div><select onchange="v2Filters.analytics.year=this.value;renderApp()" class="border p-2 rounded-xl text-sm"><option value="">Барлық оқу жылы</option>${state.academicYears.map(y=>`<option ${v2Filters.analytics.year===y?'selected':''}>${y}</option>`).join('')}</select></div><div class="grid grid-cols-2 md:grid-cols-5 gap-3">${[['Оқушылар',state.students.filter(s=>!s.archived).length],['Іс-шара',d.evs.length],['Өтінім',d.apps.length],['Жоба',d.projs.length],['Жүлде',d.ach.length]].map(x=>`<div class="bg-white border p-4 rounded-2xl"><div class="text-xs text-slate-500">${x[0]}</div><b class="text-2xl">${x[1]}</b></div>`).join('')}</div><div class="grid lg:grid-cols-2 gap-4"><div class="bg-white border rounded-2xl p-5"><h3 class="font-bold mb-3">Дарын картасы</h3>${Object.entries(talent).map(([k,v])=>`<div class="flex justify-between border-b py-2 text-sm"><span>${escapeHtml(k)}</span><b>${v}</b></div>`).join('')}</div><div class="bg-white border rounded-2xl p-5"><h3 class="font-bold mb-3">Жетекшілер мониторингі</h3>${teachers.map(t=>{const ids=state.students.filter(s=>s.supervisorId===t.id).map(s=>s.id);return `<div class="border-b py-2 text-sm"><b>${escapeHtml(t.name)}</b><div class="text-xs text-slate-500">Оқушы: ${ids.length} • Өтінім: ${state.applications.filter(a=>a.teacherId===t.id).length} • Жүлде: ${state.achievements.filter(a=>ids.includes(a.studentId)).length} • Жоба: ${state.projects.filter(p=>p.supervisorId===t.id).length}</div></div>`}).join('')}</div></div></div>`;}

    function v2RenderReports(){if(state.currentUser.role!=='ADMIN')return '';return `<div class="space-y-5"><h2 class="text-2xl font-bold">Директор есебі</h2><div class="bg-white border rounded-2xl p-5 flex flex-wrap gap-3 items-end"><div><label class="text-xs">Оқу жылы</label><select id="v2-report-year" class="block border p-2 rounded-xl">${state.academicYears.map(y=>`<option>${y}</option>`).join('')}</select></div><button onclick="v2PrintReport()" class="px-4 py-2 bg-blue-600 text-white rounded-xl">PDF / Басып шығару</button><button onclick="v2ExportReportXlsx()" class="px-4 py-2 bg-emerald-600 text-white rounded-xl">Excel жүктеу</button></div><div class="text-sm text-slate-500">Есепте оқушылар, олимпиадалар, ғылыми жобалар, жүлделер, деңгейлер және жетекшілер көрсеткіштері жинақталады.</div></div>`;}
    function v2BuildReport(year){const students=state.students.filter(s=>!s.archived);const apps=state.applications.filter(a=>a.academicYear===year);const ach=state.achievements.filter(a=>a.academicYear===year);const projs=state.projects.filter(p=>p.academicYear===year);const evs=state.events.filter(e=>e.academicYear===year&&!e.archived);const dips=state.diplomas.filter(d=>d.academicYear===year);return{students,apps,ach,projs,evs,dips};}
    function v2PrintReport(){const year=document.getElementById('v2-report-year').value,d=v2BuildReport(year);const w=window.open('','_blank');w.document.write(`<html><head><meta charset="utf-8"><title>DarynHub есеп ${year}</title><style>body{font-family:Arial;padding:30px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ddd;padding:8px}</style></head><body><h1>DarynHub — ${year} оқу жылы есебі</h1><p>Дарынды оқушылар: <b>${d.students.length}</b> | Іс-шаралар: <b>${d.evs.length}</b> | Өтінімдер: <b>${d.apps.length}</b> | Ғылыми жобалар: <b>${d.projs.length}</b> | Жүлделер: <b>${d.ach.length}</b> | Дипломдар: <b>${d.dips.length}</b></p><h2>Жетістіктер</h2><table><tr><th>Оқушы</th><th>Пән</th><th>Деңгей</th><th>Орын</th></tr>${d.ach.map(a=>`<tr><td>${escapeHtml(state.students.find(s=>s.id===a.studentId)?.name||'')}</td><td>${escapeHtml(a.subject||'')}</td><td>${escapeHtml(a.level||'')}</td><td>${escapeHtml(a.place||'')}</td></tr>`).join('')}</table><script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close();}
    function v2ExportReportXlsx(){if(!window.XLSX)return v2Toast('SheetJS жүктелмеді','error');const year=document.getElementById('v2-report-year').value,d=v2BuildReport(year);const rows=d.ach.map(a=>({Оқушы:state.students.find(s=>s.id===a.studentId)?.name||'',Пән:a.subject||'',Деңгей:a.level||'',Орын:a.place||'',Күні:a.date||''}));const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'Жетістіктер');XLSX.writeFile(wb,`DarynHub_Есеп_${year}.xlsx`);}

    function v2RenderSettings(){return `<div class="space-y-5"><h2 class="text-2xl font-bold">Баптаулар</h2><div class="bg-white border rounded-2xl p-5 space-y-3"><h3 class="font-bold">Резервтік көшірме</h3><button onclick="v2ExportBackup()" class="px-4 py-2 bg-slate-900 text-white rounded-xl text-sm">JSON backup жүктеу</button><label class="px-4 py-2 bg-blue-600 text-white rounded-xl text-sm cursor-pointer inline-block">Backup импорттау<input type="file" accept="application/json" onchange="v2ImportBackup(this.files[0])" class="hidden"></label><p class="text-xs text-slate-500">Ескерту: дипломдардың binary файлдары IndexedDB-де бөлек сақталады.</p></div><div class="bg-white border rounded-2xl p-5 text-sm"><b>DarynHub V2</b><p class="mt-2 text-slate-500">Frontend-only MVP: localStorage + IndexedDB. Нақты production қолдану үшін серверлік authentication және database қажет.</p></div></div>`;}
    function v2ExportBackup(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`DarynHub_backup_${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);}
    function v2ImportBackup(file){if(!file)return;if(!confirm('Қазіргі metadata backup деректерімен ауыстырылады. Жалғастыру керек пе?'))return;const r=new FileReader();r.onload=()=>{try{state=JSON.parse(r.result);v2MigrateState();renderApp();v2Toast('Backup импортталды');}catch(e){v2Toast('Backup файлы жарамсыз','error')}};r.readAsText(file);}

    function v2DownloadStudentImportTemplate(){
      if(!window.XLSX) return v2Toast('Excel кітапханасы жүктелмеді','error');
      const rows=[
        {'Аты-жөні':'Аян Серіков','Сынып':9,'Туған күні':'2010-05-12','Мектеп':state.settings?.schoolName||'','Бағыты':'Математика','Жетекші':'Гүлнұр Ұстаз'},
        {'Аты-жөні':'','Сынып':'','Туған күні':'','Мектеп':state.settings?.schoolName||'','Бағыты':'','Жетекші':''}
      ];
      const ws=XLSX.utils.json_to_sheet(rows,{header:['Аты-жөні','Сынып','Туған күні','Мектеп','Бағыты','Жетекші']});
      ws['!cols']=[{wch:28},{wch:10},{wch:15},{wch:30},{wch:22},{wch:25}];
      const wb=XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb,ws,'Оқушылар');
      XLSX.writeFile(wb,'DarynHub_оқушылар_импорт_шаблоны.xlsx');

    function v2OpenImportStudents(){document.getElementById('modal-container').innerHTML=`<div class="fixed inset-0 z-50 bg-slate-900/50 flex items-center justify-center p-4"><div class="bg-white rounded-2xl p-6 w-full max-w-xl relative"><button type="button" onclick="closeModal()" class="absolute right-4 top-4 w-9 h-9 rounded-full text-slate-400 hover:text-slate-700 hover:bg-slate-100 flex items-center justify-center" title="Жабу"><i class="fa-solid fa-xmark"></i></button><h3 class="font-bold text-lg mb-1 pr-10">Оқушыларды Excel арқылы импорттау</h3><p class="text-xs text-slate-500 mb-4">1. Алдымен дайын шаблонды жүктеп алыңыз. 2. Оқушыларды сол шаблонға толтырыңыз. 3. Толтырылған файлды осы жерге жүктеңіз.</p><button type="button" onclick="v2DownloadStudentImportTemplate()" class="w-full mb-4 px-4 py-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-sm font-semibold"><i class="fa-solid fa-file-arrow-down mr-2"></i>1. Excel шаблонды жүктеп алу</button><div class="border-t pt-4"><label class="block text-xs font-semibold text-slate-700 mb-2">2. Толтырылған шаблонды жүктеу</label><input type="file" accept=".xlsx,.xls,.csv" onchange="v2ParseStudentsFile(this.files[0])" class="w-full border p-3 rounded-xl"></div><div id="v2-import-preview" class="mt-4 max-h-80 overflow-y-auto"></div></div></div>`;}

    function v2InitAnalyticsCharts(){
      if(!window.Chart) return;
      v2DestroyAnalyticsCharts();
      const d=v2AnalyticsData();

      const subject=v2CountBy(d.ach,a=>a.subject||state.events.find(e=>e.id===a.eventId)?.subject);
      const place=v2CountBy(d.ach,a=>a.place);
      const level=v2CountBy(d.ach,a=>a.level);
      const grade=v2CountBy(activeStudents,s=>`${s.grade} сынып`);
      const mk=(id,cfg)=>{const el=document.getElementById(id);if(el)v2AnalyticsCharts.push(new Chart(el,cfg));};
      const common={responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{precision:0},grid:{color:'#f1f5f9'}},x:{grid:{display:false}}}};
      mk('v2-subject-chart',{type:'bar',data:{labels:Object.keys(subject),datasets:[{label:'Жүлде',data:Object.values(subject),backgroundColor:'#3b82f6',borderRadius:8}]},options:common});
      mk('v2-place-chart',{type:'doughnut',data:{labels:Object.keys(place),datasets:[{data:Object.values(place),backgroundColor:['#10b981','#3b82f6','#f59e0b','#8b5cf6','#f43f5e','#94a3b8'],borderWidth:3,borderColor:'#fff'}]},options:{responsive:true,maintainAspectRatio:false,cutout:'62%',plugins:{legend:{position:'bottom',labels:{boxWidth:12,font:{size:10}}}}}});
      mk('v2-level-chart',{type:'bar',data:{labels:Object.keys(level),datasets:[{label:'Нәтиже',data:Object.values(level),backgroundColor:'#8b5cf6',borderRadius:8}]},options:{...common,indexAxis:'y'}});
      mk('v2-grade-chart',{type:'bar',data:{labels:Object.keys(grade).sort(),datasets:[{label:'Оқушы',data:Object.keys(grade).sort().map(k=>grade[k]),backgroundColor:'#10b981',borderRadius:8}]},options:common});
    }
    // renderApp finishes the DOM first; initialize Analytics charts afterwards.
    const v2QualityOldRenderApp = renderApp;

    // App bootstrap: the script is already at the end of <body>, so do not wait for

    try {

      if (root) root.innerHTML = `<div style="padding:24px;font-family:Arial,sans-serif"><h2>DarynHub іске қосылмады</h2><p>${String(err && err.message ? err.message : err)}</p></div>`;
